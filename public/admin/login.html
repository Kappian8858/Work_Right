<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkRight - Employer Admin Portal Login</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .login-container {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-header .logo {
      font-size: 38px;
      margin-bottom: 8px;
    }
    .login-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
    }
    .login-header p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      color: #0f172a;
    }
    .form-input:focus {
      border-color: #2563eb;
      outline: none;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: 6px;
    }
    .btn-login:hover {
      background: #1d4ed8;
    }
    .credential-box {
      background: #eff6ff;
      border: 1px dashed #93c5fd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 20px;
      font-size: 12px;
      color: #1e40af;
      text-align: center;
    }
    .error-alert {
      display: none;
      background: #fef2f2;
      border: 1px solid #f87171;
      color: #991b1b;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main class="login-container">
    <div class="login-header">
      <div class="logo">🛡️</div>
      <h1>WorkRight Admin Portal</h1>
      <p>Employer Wage Compliance &amp; Safety Dashboard</p>
    </div>

    <div id="errorAlert" class="error-alert" role="alert"></div>

    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label for="usernameInput" class="form-label">Admin Username</label>
        <input
          type="text"
          id="usernameInput"
          class="form-input"
          value="admin"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="passwordInput" class="form-label">Password</label>
        <input
          type="password"
          id="passwordInput"
          class="form-input"
          value="admin"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn-login" id="loginSubmitBtn">
        Sign In as Administrator →
      </button>

      <div class="credential-box">
        <strong>Demo Credentials:</strong><br>
        Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>admin</code>
      </div>

      <div style="text-align: center; margin-top: 18px;">
        <a href="/worker/" style="font-size: 13px; color: #2563eb; text-decoration: none; font-weight: 600;">
          ← Switch to Worker Mobile Portal
        </a>
      </div>
    </form>
  </main>

  <script>
    async function handleAdminLogin(e) {
      e.preventDefault();
      const errorAlert = document.getElementById('errorAlert');
      errorAlert.style.display = 'none';

      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      try {
        const res = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Invalid username or password');
        }

        // Store admin session
        localStorage.setItem('workright_admin_logged_in', 'true');
        localStorage.setItem('workright_admin_token', data.token || 'admin123');
        localStorage.setItem('workright_admin_user', username);

        // Redirect to Pay Compliance panel
        window.location.href = '/admin/pay.html';
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.style.display = 'block';
      }
    }
  </script>
</body>
</html>
